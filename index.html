    // ============================================================
    // TOUR / DEMO MODE — CINEMATIC
    // ============================================================
    let tourActive = false;
    let tourIndex = 0;
    let tourAnimId = null;
    let tourTimeout = null;

    function startTour() {
        if (tourActive || cTourActive) return;
        stopFollow();
        tourActive = true; tourIndex = 0;
        document.getElementById('tour-overlay').classList.add('active');
        document.getElementById('cine-top').classList.add('active');
        document.getElementById('cine-bottom').classList.add('active');
        document.getElementById('tour-skip').style.display = 'block';
        document.getElementById('info-panel').style.display = 'none';
        controls.enabled = false;

        // Audio — start music if not already playing
        initAudio();
        if (!musicPlaying) startAmbientDrone();
        playSubHit();

        const prog = document.getElementById('tour-progress');
        prog.innerHTML = '';
        for (let i = 0; i < planets.length; i++) {
            const d = document.createElement('div'); d.className = 'tour-dot'; prog.appendChild(d);
        }

        tourShowOverview(() => tourVisitPlanet(0));
    }

    function stopTour() {
        tourActive = false;
        if (tourAnimId) { cancelAnimationFrame(tourAnimId); tourAnimId = null; }
        if (tourTimeout) { clearTimeout(tourTimeout); tourTimeout = null; }
        document.getElementById('tour-overlay').classList.remove('active');
        document.getElementById('cine-top').classList.remove('active');
        document.getElementById('cine-bottom').classList.remove('active');
        document.getElementById('tour-skip').style.display = 'none';
        document.getElementById('tour-name').className = '';
        document.getElementById('tour-desc').className = '';
        document.getElementById('info-panel').style.display = 'none';
        controls.enabled = true;
        camera.fov = 60; camera.updateProjectionMatrix();
        stopNarration();
        // Only stop music if it wasn't playing before tour
        if (!musicPlaying) stopAmbientDrone();
        cinematicMoveTo(new THREE.Vector3(30,40,60), new THREE.Vector3(0,0,0), 2500);
    }

    function tourShowOverview(callback) {
        if (!tourActive) return;
        const nameEl = document.getElementById('tour-name');
        const descEl = document.getElementById('tour-desc');
        document.getElementById('tour-counter').textContent = '';
        nameEl.textContent = 'PLANETARIUM RAZAN'; descEl.textContent = 'Menjelajahi keagungan tata surya kita';
        nameEl.className = ''; descEl.className = '';
        speakNarration('Selamat datang di Planetarium Razan. Mari menjelajahi keagungan tata surya kita.');

        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const endPos = new THREE.Vector3(80,55,80);
        const endTarget = new THREE.Vector3(0,0,0);
        const startTime = performance.now();
        const overviewDur = 4000; // slower, more majestic

        tourTimeout = setTimeout(() => {
            if (!tourActive) return;
            nameEl.className = 'visible'; descEl.className = 'visible';
            playArrivalChime(0);
        }, 600);

        function step(now) {
            if (!tourActive) return;
            let t = Math.min(1, (now-startTime)/overviewDur);
            // Very smooth quintic
            t = t < 0.5 ? 16*t*t*t*t*t : 1-Math.pow(-2*t+2,5)/2;
            camera.position.lerpVectors(startPos, endPos, t);
            controls.target.lerpVectors(startTarget, endTarget, t);

            // Gentle FOV sweep
            camera.fov = 60 + Math.sin(t * Math.PI) * 8;
            camera.updateProjectionMatrix();

            if (t < 1) { tourAnimId = requestAnimationFrame(step); }
            else {
                camera.fov = 60; camera.updateProjectionMatrix();
                tourTimeout = setTimeout(() => {
                    if (!tourActive) return;
                    nameEl.className = 'fadeout'; descEl.className = 'fadeout';
                    tourTimeout = setTimeout(() => { if (tourActive) callback(); }, 1200);
                }, 2500);
            }
        }
        tourAnimId = requestAnimationFrame(step);
    }

    function tourVisitPlanet(index) {
        if (!tourActive || index >= planets.length) { if (tourActive) tourFinale(); return; }
        tourIndex = index;

        const p = planets[index];
        const data = p.data;
        const nameEl = document.getElementById('tour-name');
        const descEl = document.getElementById('tour-desc');
        document.getElementById('tour-counter').textContent = `${index+1} / ${planets.length}`;

        // Update dots
        document.querySelectorAll('.tour-dot').forEach((d,i) => {
            d.className = 'tour-dot'; if (i<index) d.classList.add('visited'); if (i===index) d.classList.add('active');
        });

        showInfo(data.name, data.info);

        nameEl.textContent = data.name.toUpperCase();
        descEl.textContent = TOUR_DESCRIPTIONS[index];
        nameEl.className = ''; descEl.className = '';

        // Camera distances
        const closeup = data.name === 'Matahari' ? 12 : Math.max(data.radius*5.5, 3);
        const orbitR = data.name === 'Matahari' ? 13 : Math.max(data.radius*6, 3.5);

        // === DISTANCE-BASED TIMING ===
        // Far planets get longer, more dramatic travel
        const travelDist = camera.position.distanceTo(p.mesh.position);
        const distanceFactor = Math.max(1, travelDist / 20); // 1 for nearby, up to ~5 for Neptunus

        // Approach: 3s base + up to 4s extra for distance
        const approachDur = 3000 + Math.min(4000, distanceFactor * 800);
        // Orbit: 5s base — feels more immersive
        const orbitDur = 5000;
        // Depart: 1.5s base + extra for distance to next
        const departDur = 1500 + Math.min(1500, distanceFactor * 200);

        // === SOUND ===
        // Whoosh scales with travel distance
        if (index > 0) {
            const warpDur = approachDur * 0.7;
            const warpIntens = Math.min(1.8, distanceFactor * 0.4);
            activateWarp(warpIntens, warpDur);
            playWhoosh(warpDur, warpIntens);
        }
        // Arrival chime + voice narration — delayed until we're close
        const chimeDelay = approachDur * 0.7;
        tourTimeout = setTimeout(() => {
            if (!tourActive) return;
            playArrivalChime(index);
            playSubHit();
            speakNarration(NARRATION_TEXTS[index]);
        }, chimeDelay);

        // === MULTI-PHASE ANIMATION ===
        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        let startTime = performance.now();
        let phase = 'approach';
        let orbitAngleStart = 0;

        function step(now) {
            if (!tourActive) return;
            const planetPos = p.mesh.position.clone();

            if (phase === 'approach') {
                let t = Math.min(1, (now - startTime) / approachDur);

                // Custom easing: slow start, dramatic acceleration in middle, gentle arrival
                // Combines quintic with a sine-based "hyperspace" feel
                let ease;
                if (t < 0.15) {
                    // Slow pull-away from previous position
                    ease = 2.5 * t * t;
                } else if (t < 0.6) {
                    // Accelerating through space — the "warp" phase
                    const mid = (t - 0.15) / 0.45;
                    ease = 0.056 + mid * mid * 0.5;
                } else {
                    // Decelerating into orbit — gentle arrival
                    const end = (t - 0.6) / 0.4;
                    const endEase = 1 - Math.pow(1 - end, 4);
                    ease = 0.556 + endEase * 0.444;
                }

                const approachAngle = Math.PI * 0.3;
                const endPos = new THREE.Vector3(
                    planetPos.x + Math.cos(approachAngle) * closeup,
                    planetPos.y + closeup * 0.45,
                    planetPos.z + Math.sin(approachAngle) * closeup
                );

                camera.position.lerpVectors(startPos, endPos, ease);
                controls.target.lerpVectors(startTarget, planetPos, ease);

                // FOV drama: widen during warp, narrow on arrival
                if (t < 0.15) {
                    camera.fov = 60 + t / 0.15 * 20; // widen to 80
                } else if (t < 0.6) {
                    const warpT = (t - 0.15) / 0.45;
                    camera.fov = 80 - warpT * 15; // 80 → 65
                } else {
                    const arriveT = (t - 0.6) / 0.4;
                    camera.fov = 65 - arriveT * 15; // 65 → 50 (tight closeup)
                }
                camera.updateProjectionMatrix();

                // Name appears during arrival phase
                if (t > 0.55) { nameEl.className = 'visible'; descEl.className = 'visible'; }

                if (t >= 1) {
                    phase = 'orbit'; startTime = now;
                    orbitAngleStart = Math.PI * 0.3;
                    camera.fov = 50; camera.updateProjectionMatrix();
                }
            }
            else if (phase === 'orbit') {
                const t = Math.min(1, (now - startTime) / orbitDur);
                const angle = orbitAngleStart + t * Math.PI * 1.3; // ~230° sweep

                // Gentle height breathing
                const heightVar = Math.sin(t * Math.PI * 2) * closeup * 0.15;
                // Subtle FOV breathe
                camera.fov = 50 + Math.sin(t * Math.PI * 3) * 2.5;
                camera.updateProjectionMatrix();

                camera.position.set(
                    planetPos.x + Math.cos(angle) * orbitR,
                    planetPos.y + closeup * 0.4 + heightVar,
                    planetPos.z + Math.sin(angle) * orbitR
                );
                controls.target.copy(planetPos);

                if (t >= 1) {
                    phase = 'depart'; startTime = now;
                    nameEl.className = 'fadeout'; descEl.className = 'fadeout';
                    playDepartSound();
                }
            }
            else if (phase === 'depart') {
                let t = Math.min(1, (now - startTime) / departDur);
                // Smooth ease-out
                const ease = 1 - Math.pow(1 - t, 3);

                // Pull back and upward gracefully
                const nextIdx = Math.min(index + 1, planets.length - 1);
                const nextPos = planets[nextIdx].mesh.position;
                const dirToNext = new THREE.Vector3().subVectors(nextPos, planetPos).normalize();

                const departTarget = new THREE.Vector3(
                    planetPos.x + dirToNext.x * 20 + 5,
                    30 + data.distance * 0.2,
                    planetPos.z + dirToNext.z * 20 + 5
                );
                const currentPos = camera.position.clone();
                camera.position.lerpVectors(currentPos, departTarget, ease * 0.05);

                // Gradually shift view toward next planet direction
                const midLook = new THREE.Vector3().lerpVectors(planetPos, nextPos, ease * 0.3);
                controls.target.lerp(midLook, 0.04);

                // FOV widens as we pull away
                camera.fov = 50 + ease * 12;
                camera.updateProjectionMatrix();

                if (t >= 1) {
                    tourTimeout = setTimeout(() => tourVisitPlanet(index + 1), 200);
                    return;
                }
            }

            tourAnimId = requestAnimationFrame(step);
        }
        tourAnimId = requestAnimationFrame(step);
    }

    function tourFinale() {
        if (!tourActive) return;
        const nameEl = document.getElementById('tour-name');
        const descEl = document.getElementById('tour-desc');
        nameEl.textContent = 'TERIMA KASIH'; descEl.textContent = 'Planetarium Razan — Keagungan Alam Semesta';
        speakNarration('Terima kasih telah menjelajahi tata surya bersama Planetarium Razan. Keagungan alam semesta menanti untuk dijelajahi.');
        nameEl.className = ''; descEl.className = '';
        document.querySelectorAll('.tour-dot').forEach(d => { d.className = 'tour-dot visited'; });
        document.getElementById('info-panel').style.display = 'none';

        // Final chime — a chord
        playArrivalChime(0);
        setTimeout(() => playArrivalChime(4), 200);
        setTimeout(() => playArrivalChime(7), 400);

        tourTimeout = setTimeout(() => { if (tourActive) { nameEl.className = 'visible'; descEl.className = 'visible'; } }, 300);

        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const startTime = performance.now();
        const finaleDur = 5000; // slow majestic pull-out

        function step(now) {
            if (!tourActive) return;
            let t = Math.min(1, (now-startTime)/finaleDur);
            t = t < 0.5 ? 16*t*t*t*t*t : 1-Math.pow(-2*t+2,5)/2;
            camera.position.lerpVectors(startPos, new THREE.Vector3(50,60,80), t);
            controls.target.lerpVectors(startTarget, new THREE.Vector3(0,0,0), t);
            camera.fov = 50 + t*10; camera.updateProjectionMatrix();
            if (t < 1) { tourAnimId = requestAnimationFrame(step); }
            else { tourTimeout = setTimeout(stopTour, 3000); }
        }
        tourAnimId = requestAnimationFrame(step);
    }

    // ============================================================
    // CONSTELLATION TOUR

    let cTourActive = false;
    let cTourIndex = 0;
    let cTourAnimId = null;

    function constellationCenter(con) {
        const s = con.stars;
        const len = s.length;
        return new THREE.Vector3(
            s.reduce((a,p)=>a+p[0],0)/len,
            s.reduce((a,p)=>a+p[1],0)/len,
            s.reduce((a,p)=>a+p[2],0)/len
        );
    }

    }

    // Override stopTour to also handle constellation tour
    const _origStopTour = stopTour;
    stopTour = function() {
        if (cTourActive) { stopConstellationTour(); return; }
        _origStopTour();

    function cTourShowOverview(callback) {
        if (!cTourActive) return;
        const nameEl = document.getElementById('tour-name');
        const descEl = document.getElementById('tour-desc');
        document.getElementById('tour-counter').textContent = '';
        nameEl.textContent = 'RASI BINTANG';
        descEl.textContent = 'Menjelajahi pola bintang di langit malam';
        nameEl.className = ''; descEl.className = '';

        speakNarration('Selamat datang di tur rasi bintang Planetarium Razan. Mari mengenal pola-pola bintang di langit malam.');

        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const endPos = new THREE.Vector3(0, 120, 150);
        const endTarget = new THREE.Vector3(0, 30, 0);
        const startTime = performance.now();

        cTourTimeout = setTimeout(() => { if (cTourActive) { nameEl.className = 'visible'; descEl.className = 'visible'; } }, 500);

        function step(now) {
            if (!cTourActive) return;
            let t = Math.min(1, (now-startTime)/4000);
            t = t<0.5 ? 16*t*t*t*t*t : 1-Math.pow(-2*t+2,5)/2;
            camera.position.lerpVectors(startPos, endPos, t);
            controls.target.lerpVectors(startTarget, endTarget, t);
            camera.fov = 60+Math.sin(t*Math.PI)*8; camera.updateProjectionMatrix();
            if (t < 1) { cTourAnimId = requestAnimationFrame(step); }
            else {
                camera.fov = 60; camera.updateProjectionMatrix();
                cTourTimeout = setTimeout(() => {
                    if (!cTourActive) return;
                    nameEl.className = 'fadeout'; descEl.className = 'fadeout';
                    cTourTimeout = setTimeout(() => { if (cTourActive) callback(); }, 1200);
                }, 2000);
            }
        }
        cTourAnimId = requestAnimationFrame(step);
    }

    function cTourVisit(index) {
        if (!cTourActive || index >= CONSTELLATIONS.length) {
            if (cTourActive) cTourFinale();
            return;
        }
        cTourIndex = index;
        const con = CONSTELLATIONS[index];
        const center = constellationCenter(con);
        const nameEl = document.getElementById('tour-name');
        const descEl = document.getElementById('tour-desc');
        document.getElementById('tour-counter').textContent = `${index+1} / ${CONSTELLATIONS.length}`;

        // Update dots
        document.querySelectorAll('.tour-dot').forEach((d,i) => {
            d.className = 'tour-dot';
            if (i < index) d.classList.add('visited');
            if (i === index) d.classList.add('active');
        });

        nameEl.textContent = con.name.toUpperCase();
        descEl.textContent = con.desc || '';
        nameEl.className = ''; descEl.className = '';

        // Camera: pull back far enough to see the whole constellation pattern
        const dir = center.clone().normalize();
        // Position camera between origin and constellation, facing toward it
        const camPos = center.clone().multiplyScalar(0.4);
        // Offset upward and sideways for a nice viewing angle
        const side = new THREE.Vector3(-dir.z, 0, dir.x).normalize();
        camPos.add(side.multiplyScalar(15));
        camPos.y += 20;

        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const startTime = performance.now();

        // Distance-based timing
        const travelDist = startPos.distanceTo(camPos);
        const distFactor = Math.max(1, travelDist / 30);
        const approachDur = 5000 + Math.min(3000, distFactor * 800);
        const holdMinDur = 10000;  // minimum 10s hold
        const departDur = 2500;

        // Warp + sound
        if (index > 0) {
            const warpDur = approachDur * 0.6;
            const intensity = Math.min(1.5, distFactor * 0.35);
            activateWarp(intensity, warpDur);
            playWhoosh(warpDur, intensity);
        }

        // Track narration completion
        let narrationDone = false;
        let holdTimerDone = false;

        // Narration when arriving
        const narrateDelay = approachDur * 0.75;
        cTourTimeout = setTimeout(() => {
            if (!cTourActive) return;
            playArrivalChime(index % 9);
            playSubHit();

            const text = `Ini adalah rasi bintang ${con.name}. ${con.desc}`;
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'id-ID'; utter.rate = 0.85; utter.pitch = 0.9; utter.volume = 1.0;
                const voices = window.speechSynthesis.getVoices();
                const v = voices.find(v => v.lang.startsWith('id')) || voices.find(v => v.lang.startsWith('ms')) || null;
                if (v) utter.voice = v;
                utter.onend = () => { narrationDone = true; };
                utter.onerror = () => { narrationDone = true; };
                window.speechSynthesis.speak(utter);
            } else {
                narrationDone = true;
            }
        }, narrateDelay);

        let phase = 'approach';
        let phaseStart = startTime;
        let holdOrbitAngle = 0;

        function step(now) {
            if (!cTourActive) return;

            if (phase === 'approach') {
                let t = Math.min(1, (now - phaseStart) / approachDur);
                // Slow start, dramatic middle, gentle arrival
                let ease;
                if (t < 0.2) ease = 1.5*t*t;
                else if (t < 0.55) { const m=(t-0.2)/0.35; ease = 0.06+m*m*0.44; }
                else { const e=(t-0.55)/0.45; ease = 0.5+(1-Math.pow(1-e,4))*0.5; }

                camera.position.lerpVectors(startPos, camPos, ease);
                controls.target.lerpVectors(startTarget, center, ease);

                // FOV: widen during travel, narrow on arrival
                if (t < 0.2) camera.fov = 60+t/0.2*10;
                else if (t < 0.55) camera.fov = 70-((t-0.2)/0.35)*6;
                else camera.fov = 64-((t-0.55)/0.45)*14;
                camera.updateProjectionMatrix();

                if (t > 0.6) { nameEl.className = 'visible'; descEl.className = 'visible'; }

                if (t >= 1) {
                    phase = 'hold'; phaseStart = now;
                    holdOrbitAngle = 0;
                    camera.fov = 50; camera.updateProjectionMatrix();
                }
            }
            else if (phase === 'hold') {
                const elapsed = now - phaseStart;
                // Very gentle drift
                holdOrbitAngle += 0.001;
                const driftX = Math.sin(holdOrbitAngle) * 6;
                const driftY = Math.sin(holdOrbitAngle * 0.6) * 3;

                camera.position.set(
                    camPos.x + driftX,
                    camPos.y + driftY,
                    camPos.z + Math.cos(holdOrbitAngle) * 4
                );
                controls.target.copy(center);

                const breathT = elapsed / 10000;
                camera.fov = 50 + Math.sin(breathT*Math.PI*2)*1.2;
                camera.updateProjectionMatrix();

                // Check: minimum time passed?
                if (elapsed >= holdMinDur) holdTimerDone = true;

                // Only depart when BOTH timer done AND narration done
                if (holdTimerDone && narrationDone) {
                    // Extra 1.5s pause after narration ends
                    phase = 'pause-before-depart'; phaseStart = now;
                }
            }
            else if (phase === 'pause-before-depart') {
                // Keep drifting gently for 1.5s after narration
                holdOrbitAngle += 0.001;
                camera.position.set(
                    camPos.x + Math.sin(holdOrbitAngle)*6,
                    camPos.y + Math.sin(holdOrbitAngle*0.6)*3,
                    camPos.z + Math.cos(holdOrbitAngle)*4
                );
                controls.target.copy(center);

                if (now - phaseStart >= 1500) {
                    phase = 'depart'; phaseStart = now;
                    nameEl.className = 'fadeout'; descEl.className = 'fadeout';
                    playDepartSound();
                }
            }
            else if (phase === 'depart') {
                let t = Math.min(1, (now - phaseStart) / departDur);
                const ease = 1 - Math.pow(1-t, 3);

                const pullTarget = camPos.clone();
                pullTarget.y += 25;
                pullTarget.x *= 0.85;
                pullTarget.z *= 0.85;
                camera.position.lerp(pullTarget, ease * 0.035);
                controls.target.lerp(new THREE.Vector3(0, 25, 0), ease * 0.025);
                camera.fov = 50 + ease*10;
                camera.updateProjectionMatrix();

                if (t >= 1) {
                    cTourTimeout = setTimeout(() => cTourVisit(index+1), 300);
                    return;
                }
            }

            cTourAnimId = requestAnimationFrame(step);
        }
        cTourAnimId = requestAnimationFrame(step);
    }

    function cTourFinale() {
        if (!cTourActive) return;
        const nameEl = document.getElementById('tour-name');
        const descEl = document.getElementById('tour-desc');
        nameEl.textContent = 'TERIMA KASIH';
        descEl.textContent = 'Planetarium Razan — Keindahan Langit Malam';
        speakNarration('Terima kasih telah menjelajahi rasi bintang bersama Planetarium Razan. Langit malam selalu menanti untuk dikagumi.');
        nameEl.className = ''; descEl.className = '';
        document.querySelectorAll('.tour-dot').forEach(d => d.className = 'tour-dot visited');

        playArrivalChime(0);
        setTimeout(() => playArrivalChime(4), 200);
        setTimeout(() => playArrivalChime(7), 400);

        cTourTimeout = setTimeout(() => { if (cTourActive) { nameEl.className = 'visible'; descEl.className = 'visible'; } }, 300);

        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const startTime = performance.now();

        function step(now) {
            if (!cTourActive) return;
            let t = Math.min(1, (now-startTime)/5000);
            t = t<0.5 ? 16*t*t*t*t*t : 1-Math.pow(-2*t+2,5)/2;
            camera.position.lerpVectors(startPos, new THREE.Vector3(30,40,60), t);
            controls.target.lerpVectors(startTarget, new THREE.Vector3(0,0,0), t);
            camera.fov = 50+t*10; camera.updateProjectionMatrix();
            if (t < 1) { cTourAnimId = requestAnimationFrame(step); }
            else { cTourTimeout = setTimeout(stopConstellationTour, 3000); }
        }
        cTourAnimId = requestAnimationFrame(step);
    }

    // ============================================================
    // START
    // ============================================================
    init();
    </script>
</body>
</html>
